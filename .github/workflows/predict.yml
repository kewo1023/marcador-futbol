name: Predecir la proxima jornada

# Diario. La ventana de fixtures de la fuente cubre pocos dias, asi que correr
# a diario es lo que garantiza no perderse una jornada; los dias sin partidos
# el script no escribe nada y el job termina sin commit.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Los dos workflows escriben en el mismo ledger y empujan al mismo branch.
# Sin esto, dos corridas simultaneas chocarian al hacer push.
concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  predecir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # La fuente es gratuita y de una sola persona. Cachear los CSV historicos
      # evita volver a pedirle 12 archivos cada corrida; solo la temporada en
      # curso se re-baja siempre, porque es la unica que cambia.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pip install -r requirements.txt

      - name: Cargar el historico
        run: python scripts/01_ingest.py

      - name: Emitir predicciones
        run: python scripts/04_predict.py

      - name: Guardar en el ledger
        run: |
          if [ -z "$(git status --porcelain ledger/)" ]; then
            echo "Sin predicciones nuevas. No hay nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/
          # La fecha de ESTE commit es la prueba de que la prediccion se emitio
          # antes del partido. Por eso el mensaje lleva la fecha y el conteo.
          git commit -m "predicciones: $(date -u +%Y-%m-%d) ($(git diff --cached --numstat ledger/predictions.csv | awk '{print $1}') filas)"
          git pull --rebase origin main
          git push origin main
