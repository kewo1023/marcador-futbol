name: Predecir la proxima jornada

# Cada cuatro horas. La ventana de fixtures de la fuente es corta (observado el
# 2026-09-09: tres dias), asi que un partido solo es visible durante unas pocas
# corridas antes de jugarse.
#
# POR QUE SUBIO DE DOS A SEIS (2026-09-10). Con dos corridas, entre una y otra
# pasan 12 horas, y lo que decide si una jornada entra o no es el momento en
# que la FUENTE regenera su archivo — un momento que no anuncia y que no sigue
# ningun horario. Ese dia el archivo llevaba 34 h sin regenerarse, cubria hasta
# el 10 de septiembre, y la jornada de las cinco ligas arrancaba el 11: tres
# corridas terminaron en verde sin nada que emitir. Correr cada cuatro horas no
# arregla que la foto sea vieja —eso solo lo arregla cambiar de fuente para los
# fixtures— pero recorta la espera entre que la fuente escribe y nosotros lo
# vemos, de hasta 12 h a hasta 4 h.
#
# El costo sigue siendo despreciable: el job tarda 40s y GitHub factura por
# minuto empezado, o sea 6 min/dia = ~180 min/mes de los 2000 gratuitos.
#
# Los dias sin partidos el script no escribe nada y el job termina sin commit,
# pero desde el 2026-09-10 su log SI distingue "no hay jornada" de "la fuente
# esta congelada", que antes se leian igual.
on:
  schedule:
    - cron: "0 1,5,9,13,17,21 * * *"
  workflow_dispatch:

# Los dos workflows escriben en el mismo ledger y empujan al mismo branch.
# Sin esto, dos corridas simultaneas chocarian al hacer push.
concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  predecir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # La fuente es gratuita y de una sola persona. Cachear los CSV historicos
      # evita volver a pedirle 12 archivos cada corrida; solo la temporada en
      # curso se re-baja siempre, porque es la unica que cambia.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pip install -r requirements.txt

      - name: Cargar el historico
        run: python scripts/01_ingest.py

      - name: Emitir predicciones
        run: python scripts/04_predict.py

      - name: Guardar en el ledger
        run: |
          if [ -z "$(git status --porcelain ledger/)" ]; then
            echo "Sin predicciones nuevas. No hay nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/
          # La fecha de ESTE commit es la prueba de que la prediccion se emitio
          # antes del partido. Por eso el mensaje lleva la fecha y el conteo.
          # Si solo cambio la hora de algun partido (ledger/fixtures.csv) y no
          # hubo prediccion nueva, el mensaje lo dice, para no sugerir una
          # emision que no ocurrio.
          N=$(git diff --cached --numstat ledger/predictions.csv | awk '{print $1}')
          if [ -n "$N" ]; then
            git commit -m "predicciones: $(date -u +%Y-%m-%d) ($N filas)"
          elif [ -n "$(git diff --cached --name-only ledger/fixtures.csv)" ]; then
            git commit -m "horas de partido: $(date -u +%Y-%m-%d)"
          elif [ -n "$(git diff --cached --name-only ledger/market_pre.csv)" ]; then
            # La linea del mercado se movio y no hubo nada mas que hacer.
            git commit -m "mercado pre-partido: $(date -u +%Y-%m-%dT%H:%M)"
          else
            # Solo la salud de la fuente. Una fila por corrida y liga, a
            # proposito: el log de Actions expira y esto no. Cuesta un commit
            # por corrida, y es el precio de poder responder con datos
            # "cuantas veces estuvo mal la fuente".
            git commit -m "salud de la fuente: $(date -u +%Y-%m-%dT%H:%M)"
          fi
          git pull --rebase origin main
          git push origin main
