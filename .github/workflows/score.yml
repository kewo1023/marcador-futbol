name: Ingerir resultados y recalcular el marcador

# Dos horas antes que el de predecir, para que si los dos caen el mismo dia el
# marcador ya este al dia cuando se emitan las predicciones nuevas.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # La fuente es gratuita y de una sola persona. Cachear los CSV historicos
      # evita volver a pedirle 12 archivos cada corrida; solo la temporada en
      # curso se re-baja siempre, porque es la unica que cambia.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pip install -r requirements.txt

      - name: Cargar el historico
        run: python scripts/01_ingest.py

      # El script devuelve 3 cuando hizo su trabajo pero encontro partidos que
      # se jugaron sin prediccion. Se captura el codigo para poder commitear
      # PRIMERO (si no, se perderian las metricas de esta corrida) y fallar
      # despues, para que el agujero de cobertura se vea en rojo.
      - name: Ingerir resultados y medir
        id: medir
        run: |
          set +e
          python scripts/05_score.py
          echo "codigo=$?" >> $GITHUB_OUTPUT

      - name: Guardar en el ledger
        run: |
          if [ -z "$(git status --porcelain ledger/)" ]; then
            echo "Sin resultados nuevos. No hay nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/
          # Desde el 2026-09-12 cada corrida deja una fila en
          # ledger/results_health.csv (hasta donde llega la fuente de
          # resultados), asi que siempre hay algo que commitear. El mensaje
          # distingue una corrida que cruzo resultados de una que solo
          # registro que la fuente sigue sin publicarlos.
          if [ -n "$(git diff --cached --name-only ledger/results.csv ledger/metrics.csv ledger/missed.csv)" ]; then
            git commit -m "resultados y marcador: $(date -u +%Y-%m-%d)"
          else
            git commit -m "salud de resultados: $(date -u +%Y-%m-%dT%H:%M)"
          fi
          git pull --rebase origin main
          git push origin main

      - name: Fallar si hubo partidos sin predecir
        if: steps.medir.outputs.codigo == '3'
        run: |
          echo "::error::Se jugaron partidos que el sistema nunca predijo. Ver ledger/missed.csv"
          exit 1
